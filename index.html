<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>نموذج تسجيل عربي</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px; background: #edf3f6; color: #14263b; font: 1rem/1.6 system-ui, sans-serif; }
main { width: min(100%, 460px); padding: clamp(20px, 5vw, 36px); background: #fff; border: 1px solid #cfdce6; border-radius: 20px; }
h1 { margin: 0; line-height: 1.3; }
form { display: grid; gap: 16px; margin-block-start: 24px; }
label { display: block; margin-block-end: 4px; font-weight: 650; }
input, button { width: 100%; min-height: 44px; border-radius: 8px; padding: 8px 12px; font: inherit; }
input { border: 1px solid #64758a; }
input[aria-invalid="true"] { border-color: #a32333; }
:focus-visible { outline: 3px solid #0863ae; outline-offset: 3px; }
button { border: 0; background: #154472; color: white; cursor: pointer; }
.error { display: block; color: #a32333; }
#result { color: #145637; font-weight: bold; }
#result:empty { margin: 0; }
</style>
</head>
<body>
<main>
  <h1>نموذج تسجيل عربي</h1>
  <p>جرّب ببيانات وهمية. البيانات لا تُرسل ولا تُحفظ.</p>
  <noscript>فعّل JavaScript لتجربة رسائل التحقق.</noscript>
  <form id="signup">
    <div><label for="full-name">الاسم</label><input id="full-name" dir="auto" required aria-describedby="name-error"><span class="error" id="name-error"></span></div>
    <div><label for="email">البريد الإلكتروني</label><input id="email" type="email" dir="ltr" placeholder="demo@example.com" required aria-describedby="email-error"><span class="error" id="email-error"></span></div>
    <div><label for="phone">رقم الهاتف</label><input id="phone" type="tel" dir="ltr" placeholder="+20 100 000 0000" required aria-describedby="phone-error"><span class="error" id="phone-error"></span></div>
    <button type="submit" disabled>جرّب التسجيل</button>
    <p id="result" role="status"></p>
  </form>
</main>
<script>
const form = document.querySelector('#signup');
const fullName = document.querySelector('#full-name');
const email = document.querySelector('#email');
const phone = document.querySelector('#phone');
const result = document.querySelector('#result');
const fields = [
  { input: fullName, error: document.querySelector('#name-error'), valid: () => Boolean(fullName.value.trim()), message: 'اكتب اسمك.' },
  { input: email, error: document.querySelector('#email-error'), valid: () => email.validity.valid, message: 'اكتب بريدًا إلكترونيًا صالحًا.' },
  { input: phone, error: document.querySelector('#phone-error'), valid: () => /^\+?[0-9٠-٩۰-۹ ()-]+$/u.test(phone.value.trim()) && (phone.value.match(/[0-9٠-٩۰-۹]/gu) || []).length >= 7, message: 'اكتب رقم هاتف يحتوي على سبعة أرقام على الأقل.' },
];

form.addEventListener('submit', (event) => {
  event.preventDefault();
  let firstInvalid;
  for (const { input, error, valid, message } of fields) {
    const isValid = valid();
    input.setAttribute('aria-invalid', String(!isValid));
    error.textContent = isValid ? '' : message;
    if (!isValid && !firstInvalid) firstInvalid = input;
  }
  result.textContent = firstInvalid ? '' : 'تمت تجربة النموذج بنجاح.';
  if (firstInvalid) firstInvalid.focus();
});

form.addEventListener('input', (event) => {
  result.textContent = '';
  const field = fields.find(({ input }) => input === event.target);
  if (field && field.valid()) {
    field.input.removeAttribute('aria-invalid');
    field.error.textContent = '';
  }
});
form.noValidate = true;
form.querySelector('button').disabled = false;
</script>
</body>
</html>
